<svg width="100%" viewBox="0 0 1920 1080" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NotesHub hero background</title>
  <desc>Modern illustration with floating notes, pens, and organizational elements for a note-taking app landing page</desc>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="darkBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b2667;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a1d7a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Light mode background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)" class="light-bg"/>
  
  <!-- Dark mode background -->
  <rect width="1920" height="1080" fill="url(#darkBgGradient)" class="dark-bg" style="display:none"/>
  
  <!-- Floating circles for depth -->
  <circle cx="200" cy="150" r="120" fill="#ffffff" opacity="0.1"/>
  <circle cx="1700" cy="900" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="900" cy="900" r="100" fill="#ffffff" opacity="0.06"/>
  
  <!-- Floating note 1 - tilted left -->
  <g transform="translate(150, 200) rotate(-15)">
    <rect width="200" height="260" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <line x1="20" y1="60" x2="180" y2="60" stroke="#fcd34d" stroke-width="2"/>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#fcd34d" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="110" x2="180" y2="110" stroke="#fcd34d" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="130" x2="180" y2="130" stroke="#fcd34d" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Floating note 2 - tilted right -->
  <g transform="translate(1650, 350) rotate(20)">
    <rect width="200" height="260" rx="8" fill="#c7d2fe" stroke="#818cf8" stroke-width="2"/>
    <line x1="20" y1="60" x2="180" y2="60" stroke="#dbeafe" stroke-width="2"/>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#dbeafe" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="110" x2="180" y2="110" stroke="#dbeafe" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="130" x2="180" y2="130" stroke="#dbeafe" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Floating note 3 - center -->
  <g transform="translate(900, 600) rotate(-8)">
    <rect width="200" height="260" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <line x1="20" y1="60" x2="180" y2="60" stroke="#c7d2fe" stroke-width="2"/>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#c7d2fe" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="110" x2="180" y2="110" stroke="#c7d2fe" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Pen 1 -->
  <g transform="translate(400, 400) rotate(-30)">
    <rect x="0" y="0" width="20" height="200" rx="10" fill="#ec4899"/>
    <circle cx="10" cy="200" r="8" fill="#be185d"/>
  </g>
  
  <!-- Pen 2 -->
  <g transform="translate(1400, 700) rotate(35)">
    <rect x="0" y="0" width="20" height="200" rx="10" fill="#06b6d4"/>
    <circle cx="10" cy="200" r="8" fill="#0369a1"/>
  </g>
  
  <!-- Light rays / accent shapes -->
  <path d="M 300 100 Q 400 200 300 300" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 1600 200 Q 1500 350 1600 450" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.2"/>
  
  <!-- Sparkle elements -->
  <g opacity="0.4">
    <circle cx="600" cy="300" r="4" fill="#ffffff"/>
    <circle cx="700" cy="200" r="3" fill="#ffffff"/>
    <circle cx="1200" cy="500" r="4" fill="#ffffff"/>
    <circle cx="500" cy="700" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Checkmark icon element -->
  <g transform="translate(1100, 200)" opacity="0.3">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M -15 0 L -5 10 L 15 -10" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Lightbulb icon element -->
  <g transform="translate(250, 850)" opacity="0.25">
    <ellipse cx="0" cy="-15" rx="20" ry="25" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-8" y1="15" x2="8" y2="15" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-6" y1="22" x2="6" y2="22" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  
  <!-- Decorative lines -->
  <line x1="100" y1="500" x2="300" y2="520" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
  <line x1="1600" y1="300" x2="1800" y2="280" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
  
  <style>
    @media (prefers-color-scheme: dark) {
      .light-bg { display: none; }
      .dark-bg { display: block; }
    }
    @media (prefers-color-scheme: light) {
      .light-bg { display: block; }
      .dark-bg { display: none; }
    }
  </style>
</svg>